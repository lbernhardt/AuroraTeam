name: Founder Agent

on:
  workflow_call:
    inputs:
      qa_ready:
        description: "Resultado de QA"
        required: true
        type: string
      backlog_present:
        description: "Indica si el backlog está presente"
        required: true
        type: string
      issue_number:
        description: "Número del issue de GitHub asociado a Founder"
        required: false
        type: string
      milestone_name:
        description: "Nombre del milestone para buscar el issue"
        required: false
        type: string
      agent_tag:
        description: "Tag del agente que indica el issue correspondiente"
        required: false
        type: string
    outputs:
      release_ready:
        description: "Indica si el proyecto está listo para una nueva entrega"
        value: ${{ jobs.founder.outputs.release_ready }}

jobs:
  founder:
    runs-on: ubuntu-latest
    outputs:
      release_ready: ${{ steps.set.outputs.release_ready }}
    steps:
      - uses: actions/checkout@v4
      - name: Verificar inputs de QA y backlog
        run: |
          if [ "${{ inputs.qa_ready }}" != "true" ]; then
            echo "QA falló, no se puede continuar"
            exit 1
          fi
          if [ "${{ inputs.backlog_present }}" != "true" ]; then
            echo "Backlog ausente"
            exit 1
          fi
      - name: Verificar backlog de producto
        run: |
          test -f docs/backlog.md
          echo "Backlog de producto encontrado"
          echo "Resumen del backlog:"
          sed -n '1,20p' docs/backlog.md
      - id: set
        run: |
          echo "release_ready=true" >> $GITHUB_OUTPUT

      - name: Cerrar issue de Founder
        if: ${{ inputs.issue_number != '' || (inputs.milestone_name != '' && inputs.agent_tag != '') }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            let issueNumber = inputs.issue_number
            if (!issueNumber) {
              const milestoneName = inputs.milestone_name
              const agentTag = inputs.agent_tag
              const { data: milestones } = await github.rest.issues.listMilestones({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'all'
              })
              const milestone = milestones.find(m => m.title === milestoneName)
              if (!milestone) throw new Error(`Milestone not found: ${milestoneName}`)
              const { data: issues } = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                milestone: milestone.number,
                state: 'open',
                per_page: 100
              })
              const escapedTag = agentTag.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')
              const tagPattern = new RegExp(`\\[.*${escapedTag}.*\\]`)
              const found = issues.find(issue => tagPattern.test(issue.title) || tagPattern.test(issue.body || ''))
              if (!found) throw new Error(`No issue found for tag [${agentTag}] in milestone ${milestoneName}`)
              issueNumber = found.number
            }
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt(issueNumber, 10),
              state: 'closed'
            })
