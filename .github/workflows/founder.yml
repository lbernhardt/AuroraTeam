name: Founder Agent

on:
  workflow_call:
    inputs:
      qa_ready:
        description: "Resultado de QA"
        required: true
        type: string
      backlog_present:
        description: "Indica si el backlog está presente"
        required: true
        type: string
      issue_number:
        description: "Número del issue de GitHub para marcar la task"
        required: false
        type: string
      issue_task:
        description: "Texto exacto de la task en el issue"
        required: false
        type: string
    outputs:
      release_ready:
        description: "Indica si el proyecto está listo para una nueva entrega"
        value: ${{ jobs.founder.outputs.release_ready }}

jobs:
  founder:
    runs-on: ubuntu-latest
    outputs:
      release_ready: ${{ steps.set.outputs.release_ready }}
    steps:
      - uses: actions/checkout@v4
      - name: Verificar inputs de QA y backlog
        run: |
          if [ "${{ inputs.qa_ready }}" != "true" ]; then
            echo "QA falló, no se puede continuar"
            exit 1
          fi
          if [ "${{ inputs.backlog_present }}" != "true" ]; then
            echo "Backlog ausente"
            exit 1
          fi
      - name: Verificar backlog de producto
        run: |
          test -f docs/backlog.md
          echo "Backlog de producto encontrado"
          echo "Resumen del backlog:"
          sed -n '1,20p' docs/backlog.md
      - id: set
        run: |
          echo "release_ready=true" >> $GITHUB_OUTPUT

      - name: Marcar task de Founder en el issue
        if: ${{ inputs.issue_number != '' && inputs.issue_task != '' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issueNumber = parseInt(inputs.issue_number, 10)
            const task = inputs.issue_task
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber
            })
            const body = issue.body || ''
            const escaped = task.replace(/([.*+?^${}()|[\]\/\\])/g, '\\$1')
            const regex = new RegExp('^[-*] \\[' + ' \\] ' + escaped + '$', 'm')
            if (!regex.test(body)) {
              core.warning(`Task not found: ${task}`)
            } else {
              const newBody = body.replace(regex, `- [x] ${task}`)
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: newBody
              })
            }
