name: Frontend Agent
on:
  workflow_dispatch:
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Configurar Node
        uses: actions/setup-node@v3
        with:
          node-version: "18"
      - name: Instalar dependencias
        run: cd frontend && npm install
      - name: Ejecutar tests
        run: cd frontend && npm test -- --watchAll=false
