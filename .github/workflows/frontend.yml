name: Frontend Agent

on:
  workflow_call:
    inputs:
      backend_ready:
        description: "Resultado de validación del backend"
        required: true
        type: string
      issue_number:
        description: "Número del issue de GitHub asociado a Frontend"
        required: false
        type: string
      milestone_name:
        description: "Nombre del milestone para buscar el issue"
        required: false
        type: string
      agent_tag:
        description: "Tag del agente que indica el issue correspondiente"
        required: false
        type: string
    outputs:
      frontend_ready:
        description: "Indica si el frontend pasó pruebas y build"
        value: ${{ jobs.frontend.outputs.frontend_ready }}

jobs:
  frontend:
    runs-on: ubuntu-latest
    outputs:
      frontend_ready: ${{ steps.set.outputs.frontend_ready }}
    steps:
      - uses: actions/checkout@v4
      - name: Validar input de Backend
        run: |
          if [ "${{ inputs.backend_ready }}" != "true" ]; then
            echo "Backend validation failed, aborting frontend checks"
            exit 1
          fi
      - name: Configurar Node
        uses: actions/setup-node@v3
        with:
          node-version: "18"
      - name: Instalar dependencias frontend
        run: cd frontend/frontend && npm ci
      - name: Ejecutar pruebas frontend
        run: cd frontend/frontend && npm test -- --watchAll=false
      - name: Construir frontend
        run: cd frontend/frontend && npm run build
      - id: set
        run: |
          echo "frontend_ready=true" >> $GITHUB_OUTPUT

      - name: Cerrar issue de Frontend
        if: ${{ inputs.issue_number != '' || (inputs.milestone_name != '' && inputs.agent_tag != '') }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            let issueNumber = inputs.issue_number
            if (!issueNumber) {
              const milestoneName = inputs.milestone_name
              const agentTag = inputs.agent_tag
              const { data: milestones } = await github.rest.issues.listMilestones({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'all'
              })
              const milestone = milestones.find(m => m.title === milestoneName)
              if (!milestone) throw new Error(`Milestone not found: ${milestoneName}`)
              const { data: issues } = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                milestone: milestone.number,
                state: 'open',
                per_page: 100
              })
              const escapedTag = agentTag.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')
              const tagPattern = new RegExp(`\\[.*${escapedTag}.*\\]`)
              const found = issues.find(issue => tagPattern.test(issue.title) || tagPattern.test(issue.body || ''))
              if (!found) throw new Error(`No issue found for tag [${agentTag}] in milestone ${milestoneName}`)
              issueNumber = found.number
            }
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt(issueNumber, 10),
              state: 'closed'
            })
