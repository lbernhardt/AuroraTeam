name: Frontend Agent

on:
  workflow_call:
    inputs:
      backend_ready:
        description: "Resultado de validación del backend"
        required: true
        type: string
      issue_number:
        description: "Número del issue de GitHub para marcar la task"
        required: false
        type: string
      issue_task:
        description: "Texto exacto de la task en el issue"
        required: false
        type: string
    outputs:
      frontend_ready:
        description: "Indica si el frontend pasó pruebas y build"
        value: ${{ jobs.frontend.outputs.frontend_ready }}

jobs:
  frontend:
    runs-on: ubuntu-latest
    outputs:
      frontend_ready: ${{ steps.set.outputs.frontend_ready }}
    steps:
      - uses: actions/checkout@v4
      - name: Validar input de Backend
        run: |
          if [ "${{ inputs.backend_ready }}" != "true" ]; then
            echo "Backend validation failed, aborting frontend checks"
            exit 1
          fi
      - name: Configurar Node
        uses: actions/setup-node@v3
        with:
          node-version: "18"
      - name: Instalar dependencias frontend
        run: cd frontend/frontend && npm ci
      - name: Ejecutar pruebas frontend
        run: cd frontend/frontend && npm test -- --watchAll=false
      - name: Construir frontend
        run: cd frontend/frontend && npm run build
      - id: set
        run: |
          echo "frontend_ready=true" >> $GITHUB_OUTPUT

      - name: Marcar task de Frontend en el issue
        if: ${{ inputs.issue_number != '' && inputs.issue_task != '' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issueNumber = parseInt(inputs.issue_number, 10)
            const task = inputs.issue_task
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber
            })
            const body = issue.body || ''
            const escaped = task.replace(/([.*+?^${}()|[\]\/\\])/g, '\\$1')
            const regex = new RegExp('^[-*] \\[' + ' \\] ' + escaped + '$', 'm')
            if (!regex.test(body)) {
              core.warning(`Task not found: ${task}`)
            } else {
              const newBody = body.replace(regex, `- [x] ${task}`)
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: newBody
              })
            }
