name: Backend Agent
on:
  workflow_call:
    inputs:
      repo_ok:
        description: "Validación previa del repositorio por TechLead"
        required: true
        type: string
      issue_number:
        description: "Número del issue de GitHub asociado a Backend"
        required: false
        type: string
      milestone_name:
        description: "Nombre del milestone para buscar el issue"
        required: false
        type: string
      agent_tag:
        description: "Tag del agente que indica el issue correspondiente"
        required: false
        type: string
    outputs:
      backend_ready:
        description: "Indica si el backend pasó todas las validaciones"
        value: ${{ jobs.backend.outputs.backend_ready }}

jobs:
  backend:
    runs-on: ubuntu-latest
    outputs:
      backend_ready: ${{ steps.set.outputs.backend_ready }}
    steps:
      - uses: actions/checkout@v4
      - name: Validar input de TechLead
        run: |
          if [ "${{ inputs.repo_ok }}" != "true" ]; then
            echo "Repo validation failed, aborting backend checks"
            exit 1
          fi
      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Instalar dependencias backend
        run: pip install -r backend/requirements.txt
      - name: Ejecutar pruebas backend
        run: pytest backend/
      - name: Ejecutar lint backend
        run: flake8 backend/
      - id: set
        run: |
          echo "backend_ready=true" >> $GITHUB_OUTPUT

      - name: Cerrar issue de Backend
        if: ${{ inputs.issue_number != '' || (inputs.milestone_name != '' && inputs.agent_tag != '') }}
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          MILESTONE_NAME: ${{ inputs.milestone_name }}
          AGENT_TAG: ${{ inputs.agent_tag }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            let issueNumber = process.env.ISSUE_NUMBER
            if (!issueNumber) {
              const milestoneName = process.env.MILESTONE_NAME
              const agentTag = process.env.AGENT_TAG
              const { data: milestones } = await github.rest.issues.listMilestones({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'all'
              })
              const milestone = milestones.find(m => m.title === milestoneName)
              if (!milestone) throw new Error(`Milestone not found: ${milestoneName}`)
              const { data: issues } = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                milestone: milestone.number,
                state: 'open',
                per_page: 100
              })
              const escapedTag = agentTag.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')
              const tagPattern = new RegExp(`\\[.*${escapedTag}.*\\]`)
              const found = issues.find(issue => tagPattern.test(issue.title) || tagPattern.test(issue.body || ''))
              if (!found) throw new Error(`No issue found for tag [${agentTag}] in milestone ${milestoneName}`)
              issueNumber = found.number
            }
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt(issueNumber, 10),
              state: 'closed'
            })
