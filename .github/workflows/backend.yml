name: Backend Agent
on:
  workflow_call:
    inputs:
      repo_ok:
        description: "Validación previa del repositorio por TechLead"
        required: true
        type: string
      issue_number:
        description: "Número del issue de GitHub para marcar la task"
        required: false
        type: string
      issue_task:
        description: "Texto exacto de la task en el issue"
        required: false
        type: string
    outputs:
      backend_ready:
        description: "Indica si el backend pasó todas las validaciones"
        value: ${{ jobs.backend.outputs.backend_ready }}

jobs:
  backend:
    runs-on: ubuntu-latest
    outputs:
      backend_ready: ${{ steps.set.outputs.backend_ready }}
    steps:
      - uses: actions/checkout@v4
      - name: Validar input de TechLead
        run: |
          if [ "${{ inputs.repo_ok }}" != "true" ]; then
            echo "Repo validation failed, aborting backend checks"
            exit 1
          fi
      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Instalar dependencias backend
        run: pip install -r backend/requirements.txt
      - name: Ejecutar pruebas backend
        run: pytest backend/
      - name: Ejecutar lint backend
        run: flake8 backend/
      - id: set
        run: |
          echo "backend_ready=true" >> $GITHUB_OUTPUT

      - name: Marcar task de Backend en el issue
        if: ${{ inputs.issue_number != '' && inputs.issue_task != '' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issueNumber = parseInt(inputs.issue_number, 10)
            const task = inputs.issue_task
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber
            })
            const body = issue.body || ''
            const escaped = task.replace(/([.*+?^${}()|[\]\/\\])/g, '\\$1')
            const regex = new RegExp('^[-*] \\[' + ' \\] ' + escaped + '$', 'm')
            if (!regex.test(body)) {
              core.warning(`Task not found: ${task}`)
            } else {
              const newBody = body.replace(regex, `- [x] ${task}`)
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: newBody
              })
            }
