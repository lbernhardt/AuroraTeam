name: Sprint 0 Orchestrator

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "GitHub issue number para marcar tareas de los agentes"
        required: false
        default: ''

jobs:
  techlead:
    uses: ./.github/workflows/techlead.yml
    with:
      issue_number: '${{ github.event.inputs.issue_number }}'
      issue_task: 'TechLead: Validar estructura del repositorio'

  backend:
    needs: techlead
    uses: ./.github/workflows/backend.yml
    with:
      repo_ok: '${{ needs.techlead.outputs.repo_ok }}'
      issue_number: '${{ github.event.inputs.issue_number }}'
      issue_task: 'Backend: Validar backend'

  frontend:
    needs: backend
    uses: ./.github/workflows/frontend.yml
    with:
      backend_ready: '${{ needs.backend.outputs.backend_ready }}'
      issue_number: '${{ github.event.inputs.issue_number }}'
      issue_task: 'Frontend: Validar frontend'

  qa:
    needs: [frontend, backend, techlead]
    uses: ./.github/workflows/qa.yml
    with:
      repo_ok: '${{ needs.techlead.outputs.repo_ok }}'
      backend_ready: '${{ needs.backend.outputs.backend_ready }}'
      frontend_ready: '${{ needs.frontend.outputs.frontend_ready }}'
      backlog_present: '${{ needs.techlead.outputs.backlog_present }}'
      issue_number: '${{ github.event.inputs.issue_number }}'
      issue_task: 'QA: Validar pruebas e integraciones'

  founder:
    needs: [qa, techlead]
    uses: ./.github/workflows/founder.yml
    with:
      qa_ready: '${{ needs.qa.outputs.qa_ready }}'
      backlog_present: '${{ needs.techlead.outputs.backlog_present }}'
      issue_number: '${{ github.event.inputs.issue_number }}'
      issue_task: 'Founder: Verificar backlog y release'
