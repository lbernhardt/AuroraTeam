name: Sprint 0 Orchestrator

on:
  workflow_dispatch:

jobs:
  techlead:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: echo "Tech Lead validando stack y estándares..."

  backend:
    runs-on: ubuntu-latest
    needs: techlead
    steps:
      - uses: actions/checkout@v3
      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - run: pip install flask pytest requests
      - run: pytest backend/

  frontend:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v3
      - name: Configurar Node
        uses: actions/setup-node@v3
        with:
          node-version: "18"
      - run: npm install
      - run: npm test

  qa:
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v3
      - run: npm install cypress
      - run: npx cypress run

  founder:
    runs-on: ubuntu-latest
    needs: qa
    steps:
      - uses: actions/checkout@v3
      - run: test -f docs/backlog.md
