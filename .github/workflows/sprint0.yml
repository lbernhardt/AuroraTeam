name: Sprint 0 Orchestrator

permissions:
  issues: write

on:
  workflow_dispatch:
    inputs:
      milestone_name:
        description: "Nombre del milestone para buscar issues"
        required: true

jobs:
  techlead:
    uses: ./.github/workflows/techlead.yml
    with:
      milestone_name: '${{ github.event.inputs.milestone_name }}'
      agent_tag: 'Tech Lead'

  backend:
    needs: techlead
    uses: ./.github/workflows/backend.yml
    with:
      repo_ok: '${{ needs.techlead.outputs.repo_ok }}'
      milestone_name: '${{ github.event.inputs.milestone_name }}'
      agent_tag: 'Backend'

  frontend:
    needs: backend
    uses: ./.github/workflows/frontend.yml
    with:
      backend_ready: '${{ needs.backend.outputs.backend_ready }}'
      milestone_name: '${{ github.event.inputs.milestone_name }}'
      agent_tag: 'Frontend'

  qa:
    needs: [frontend, backend, techlead]
    uses: ./.github/workflows/qa.yml
    with:
      repo_ok: '${{ needs.techlead.outputs.repo_ok }}'
      backend_ready: '${{ needs.backend.outputs.backend_ready }}'
      frontend_ready: '${{ needs.frontend.outputs.frontend_ready }}'
      backlog_present: '${{ needs.techlead.outputs.backlog_present }}'
      milestone_name: '${{ github.event.inputs.milestone_name }}'
      agent_tag: 'QA'

  founder:
    needs: [qa, techlead]
    uses: ./.github/workflows/founder.yml
    with:
      qa_ready: '${{ needs.qa.outputs.qa_ready }}'
      backlog_present: '${{ needs.techlead.outputs.backlog_present }}'
      milestone_name: '${{ github.event.inputs.milestone_name }}'
      agent_tag: 'Founder'
