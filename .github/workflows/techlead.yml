name: TechLead Agent

on:
  workflow_call:
    inputs:
      issue_number:
        description: "Número del issue de GitHub asociado a TechLead"
        required: false
        type: string
      milestone_name:
        description: "Nombre del milestone para buscar el issue"
        required: false
        type: string
      agent_tag:
        description: "Tag del agente que indica el issue correspondiente"
        required: false
        type: string
    outputs:
      repo_ok:
        description: "Resultado de validación del repositorio"
        value: ${{ jobs.techlead.outputs.repo_ok }}
      backlog_present:
        description: "Indica si el backlog de producto está presente"
        value: ${{ jobs.techlead.outputs.backlog_present }}

jobs:
  techlead:
    runs-on: ubuntu-latest
    outputs:
      repo_ok: ${{ steps.set.outputs.repo_ok }}
      backlog_present: ${{ steps.set.outputs.backlog_present }}
    steps:
      - uses: actions/checkout@v4
      - name: Validar estructura del proyecto
        run: |
          test -f backend/app.py
          test -f backend/test_app.py
          test -f frontend/frontend/package.json
          test -f .github/workflows/frontend.yml
          test -f .github/workflows/backend.yml
          test -f docs/backlog.md
      - name: Validar archivos Python
        run: python -m py_compile backend/app.py backend/test_app.py
      - name: Validar paquete frontend
        run: |
          cd frontend/frontend
          npm ci --ignore-scripts
          test -f package.json
      - id: set
        run: |
          echo "repo_ok=true" >> $GITHUB_OUTPUT
          echo "backlog_present=true" >> $GITHUB_OUTPUT

      - name: Cerrar issue de TechLead
        if: ${{ inputs.issue_number != '' || (inputs.milestone_name != '' && inputs.agent_tag != '') }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issueNumber = core.getInput('issue_number')
            if (!issueNumber) {
              const milestoneName = core.getInput('milestone_name')
              const agentTag = core.getInput('agent_tag')
              const { data: milestones } = await github.rest.issues.listMilestones({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'all'
              })
              const milestone = milestones.find(m => m.title === milestoneName)
              if (!milestone) throw new Error(`Milestone not found: ${milestoneName}`)
              const { data: issues } = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                milestone: milestone.number,
                state: 'open',
                per_page: 100
              })
              const escapedTag = agentTag.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')
              const tagPattern = new RegExp(`\\[.*${escapedTag}.*\\]`)
              const found = issues.find(issue => tagPattern.test(issue.title) || tagPattern.test(issue.body || ''))
              if (!found) throw new Error(`No issue found for tag [${agentTag}] in milestone ${milestoneName}`)
              issueNumber = found.number
            }
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt(issueNumber, 10),
              state: 'closed'
            })
