name: TechLead Agent

on:
  workflow_call:
    inputs:
      issue_number:
        description: "Número del issue de GitHub para marcar la task"
        required: false
        type: string
      issue_task:
        description: "Texto exacto de la task en el issue"
        required: false
        type: string
    outputs:
      repo_ok:
        description: "Resultado de validación del repositorio"
        value: ${{ jobs.techlead.outputs.repo_ok }}
      backlog_present:
        description: "Indica si el backlog de producto está presente"
        value: ${{ jobs.techlead.outputs.backlog_present }}

jobs:
  techlead:
    runs-on: ubuntu-latest
    outputs:
      repo_ok: ${{ steps.set.outputs.repo_ok }}
      backlog_present: ${{ steps.set.outputs.backlog_present }}
    steps:
      - uses: actions/checkout@v4
      - name: Validar estructura del proyecto
        run: |
          test -f backend/app.py
          test -f backend/test_app.py
          test -f frontend/frontend/package.json
          test -f .github/workflows/frontend.yml
          test -f .github/workflows/backend.yml
          test -f docs/backlog.md
      - name: Validar archivos Python
        run: python -m py_compile backend/app.py backend/test_app.py
      - name: Validar paquete frontend
        run: |
          cd frontend/frontend
          npm ci --ignore-scripts
          test -f package.json
      - id: set
        run: |
          echo "repo_ok=true" >> $GITHUB_OUTPUT
          echo "backlog_present=true" >> $GITHUB_OUTPUT

      - name: Marcar task de TechLead en el issue
        if: ${{ inputs.issue_number != '' && inputs.issue_task != '' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issueNumber = parseInt(inputs.issue_number, 10)
            const task = inputs.issue_task
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber
            })
            const body = issue.body || ''
            const escaped = task.replace(/([.*+?^${}()|[\]\/\\])/g, '\\$1')
            const regex = new RegExp('^[-*] \\[' + ' \\] ' + escaped + '$', 'm')
            if (!regex.test(body)) {
              core.warning(`Task not found: ${task}`)
            } else {
              const newBody = body.replace(regex, `- [x] ${task}`)
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: newBody
              })
            }
