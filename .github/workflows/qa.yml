name: QA Agent

on:
  workflow_call:
    inputs:
      repo_ok:
        description: "Resultado de validación del repositorio por TechLead"
        required: true
        type: string
      backend_ready:
        description: "Resultado de validación del backend"
        required: true
        type: string
      frontend_ready:
        description: "Resultado de validación del frontend"
        required: true
        type: string
      backlog_present:
        description: "Indica si el backlog está presente"
        required: true
        type: string
      issue_number:
        description: "Número del issue de GitHub asociado a QA"
        required: false
        type: string
      milestone_name:
        description: "Nombre del milestone para buscar el issue"
        required: false
        type: string
      agent_tag:
        description: "Tag del agente que indica el issue correspondiente"
        required: false
        type: string
    outputs:
      qa_ready:
        description: "Indica si QA completó todas las validaciones"
        value: ${{ jobs.qa.outputs.qa_ready }}

jobs:
  qa:
    runs-on: ubuntu-latest
    outputs:
      qa_ready: ${{ steps.set.outputs.qa_ready }}
    steps:
      - uses: actions/checkout@v4
      - name: Verificar inputs de agentes previos
        run: |
          if [ "${{ inputs.repo_ok }}" != "true" ]; then
            echo "TechLead validación fallida"
            exit 1
          fi
          if [ "${{ inputs.backend_ready }}" != "true" ]; then
            echo "Backend no está listo"
            exit 1
          fi
          if [ "${{ inputs.frontend_ready }}" != "true" ]; then
            echo "Frontend no está listo"
            exit 1
          fi
          if [ "${{ inputs.backlog_present }}" != "true" ]; then
            echo "Backlog de producto ausente"
            exit 1
          fi
      - name: Configurar Node
        uses: actions/setup-node@v3
        with:
          node-version: "18"
      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Ejecutar pruebas frontend
        run: |
          cd frontend/frontend
          npm ci
          npm test -- --watchAll=false
      - name: Ejecutar pruebas backend
        run: |
          pip install -r backend/requirements.txt
          pytest backend/
      - name: Validar documentación de producto
        run: |
          test -f docs/backlog.md
          echo "QA valida backlog y criterios de entrega"
      - id: set
        run: |
          echo "qa_ready=true" >> $GITHUB_OUTPUT

      - name: Cerrar issue de QA
        if: ${{ inputs.issue_number != '' || (inputs.milestone_name != '' && inputs.agent_tag != '') }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issueNumber = core.getInput('issue_number')
            if (!issueNumber) {
              const milestoneName = core.getInput('milestone_name')
              const agentTag = core.getInput('agent_tag')
              const { data: milestones } = await github.rest.issues.listMilestones({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'all'
              })
              const milestone = milestones.find(m => m.title === milestoneName)
              if (!milestone) throw new Error(`Milestone not found: ${milestoneName}`)
              const { data: issues } = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                milestone: milestone.number,
                state: 'open',
                per_page: 100
              })
              const escapedTag = agentTag.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')
              const tagPattern = new RegExp(`\\[.*${escapedTag}.*\\]`)
              const found = issues.find(issue => tagPattern.test(issue.title) || tagPattern.test(issue.body || ''))
              if (!found) throw new Error(`No issue found for tag [${agentTag}] in milestone ${milestoneName}`)
              issueNumber = found.number
            }
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt(issueNumber, 10),
              state: 'closed'
            })
