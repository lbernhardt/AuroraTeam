name: QA Agent

on:
  workflow_call:
    inputs:
      repo_ok:
        description: "Resultado de validación del repositorio por TechLead"
        required: true
        type: string
      backend_ready:
        description: "Resultado de validación del backend"
        required: true
        type: string
      frontend_ready:
        description: "Resultado de validación del frontend"
        required: true
        type: string
      backlog_present:
        description: "Indica si el backlog está presente"
        required: true
        type: string
      issue_number:
        description: "Número del issue de GitHub para marcar la task"
        required: false
        type: string
      issue_task:
        description: "Texto exacto de la task en el issue"
        required: false
        type: string
    outputs:
      qa_ready:
        description: "Indica si QA completó todas las validaciones"
        value: ${{ jobs.qa.outputs.qa_ready }}

jobs:
  qa:
    runs-on: ubuntu-latest
    outputs:
      qa_ready: ${{ steps.set.outputs.qa_ready }}
    steps:
      - uses: actions/checkout@v4
      - name: Verificar inputs de agentes previos
        run: |
          if [ "${{ inputs.repo_ok }}" != "true" ]; then
            echo "TechLead validación fallida"
            exit 1
          fi
          if [ "${{ inputs.backend_ready }}" != "true" ]; then
            echo "Backend no está listo"
            exit 1
          fi
          if [ "${{ inputs.frontend_ready }}" != "true" ]; then
            echo "Frontend no está listo"
            exit 1
          fi
          if [ "${{ inputs.backlog_present }}" != "true" ]; then
            echo "Backlog de producto ausente"
            exit 1
          fi
      - name: Configurar Node
        uses: actions/setup-node@v3
        with:
          node-version: "18"
      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Ejecutar pruebas frontend
        run: |
          cd frontend/frontend
          npm ci
          npm test -- --watchAll=false
      - name: Ejecutar pruebas backend
        run: |
          pip install -r backend/requirements.txt
          pytest backend/
      - name: Validar documentación de producto
        run: |
          test -f docs/backlog.md
          echo "QA valida backlog y criterios de entrega"
      - id: set
        run: |
          echo "qa_ready=true" >> $GITHUB_OUTPUT

      - name: Marcar task de QA en el issue
        if: ${{ inputs.issue_number != '' && inputs.issue_task != '' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issueNumber = parseInt(inputs.issue_number, 10)
            const task = inputs.issue_task
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber
            })
            const body = issue.body || ''
            const escaped = task.replace(/([.*+?^${}()|[\]\/\\])/g, '\\$1')
            const regex = new RegExp('^[-*] \\[' + ' \\] ' + escaped + '$', 'm')
            if (!regex.test(body)) {
              core.warning(`Task not found: ${task}`)
            } else {
              const newBody = body.replace(regex, `- [x] ${task}`)
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: newBody
              })
            }
